# Run from the repository root; see docs/deployment.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: freeschool
      POSTGRES_DB: freeschool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U freeschool']
      interval: 5s
      timeout: 5s
      retries: 12
  appview:
    build:
      context: ../..
      target: appview
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      APPVIEW_PORT: '4000'
      APPVIEW_PUBLIC_URL: https://${WEB_HOST:?Set the web hostname}
      WEB_PUBLIC_URL: https://${WEB_HOST:?Set the web hostname}
      DATABASE_URL: postgres://freeschool:${POSTGRES_PASSWORD:?Set a database password}@postgres:5432/freeschool
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    stop_grace_period: 45s
  web:
    build:
      context: ../..
      target: web
    restart: unless-stopped
    environment:
      WEB_HOST: ${WEB_HOST:?Set the web hostname}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - appview
volumes:
  postgres:
  caddy_data:
  caddy_config:
